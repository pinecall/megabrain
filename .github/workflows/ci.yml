name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Callable so `release.yml` runs these EXACT gates against the tagged commit
  # before publishing — one definition, two entry points. A tag push does not
  # trigger the `push: branches` above (a tag is not a branch), so without this
  # the release path had no lint/test gate at all: 0.13.0, 0.13.1 and 0.14.0
  # all shipped with ruff failing on master.
  workflow_call:

jobs:
  # v3: lint is no longer ruff alone. The package ships `py.typed` — a PEP 561
  # promise of verified types — and v2 shipped it with ZERO type checking. mypy
  # and pyright are now part of the same gate, plus the architecture suite that
  # makes the engine's hard rules executable (no LLM in retrieval, no SQL
  # outside storage, no event loop in the engine, file/function line budgets).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[languages]" ruff mypy pyright pytest
      - run: ./scripts/lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[languages]" pytest
      # the suite is fully offline — no API key, no network, no private corpus
      - run: python -m pytest -q

  # The studio's bundle is COMMITTED, so `pip install -e .` works from a clone
  # with no node installed. This job is the other half of that deal: it rebuilds
  # from studio/src and fails if the result differs from what was committed.
  # Without it the committed bundle silently goes stale, which is the one real
  # cost of checking build output into a repository.
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix studio || npm install --prefix studio
      - run: npm run --prefix studio build
      - name: the committed bundle must match its source
        run: |
          git diff --stat --exit-code src/megabrain/transports/http/ui \
            || { echo "::error::studio bundle is stale — run: cd studio && npm run build"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install dist/*.whl && megabrain --help
