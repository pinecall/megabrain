[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megabrain"
dynamic = ["version"]                       # single-sourced from _version.py
description = "Local code-intelligence engine: one call returns all the code related to a question, explained with the real code spliced in."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
keywords = ["code-intelligence", "retrieval", "rag", "embeddings", "code-search",
            "mcp", "ast", "tree-sitter", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",                      # advertises py.typed on PyPI
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
# Three deps, deliberately. urllib (stdlib) talks to any OpenAI-compatible
# endpoint — no SDK dependency. That thinness is a product feature.
dependencies = [
    "numpy>=1.24",
    "tree_sitter>=0.21",
    "tree_sitter_typescript>=0.23",
]

# The gates, as a dependency group (PEP 735) rather than an extra: they are not
# part of what anyone installs megabrain FOR, and an extra would advertise them
# on PyPI as if they were. `uv sync --group dev` (or `pip install --group dev`)
# is all a fresh checkout needs before `./scripts/lint` — which previously
# failed on a clean machine with "ruff: command not found", and the fix lived
# only in whichever shell history had it.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyright>=1.1.380"]

[project.optional-dependencies]
# Every one of these is a wheel with native code in it. Making a default
# install carry eight of them to index a Python repository is a cost paid by
# everyone for the benefit of a few — so the registry checks which are
# importable and adds only those. Python, TS/JS and Markdown stay in the base
# dependencies because they are what most repositories are written in.
languages = ["tree_sitter_ruby>=0.23", "tree_sitter_go>=0.23",
             "tree_sitter_rust>=0.23", "tree_sitter_php>=0.23",
             "tree_sitter_c>=0.23", "tree_sitter_cpp>=0.23",
             "tree_sitter_java>=0.23", "tree_sitter_c_sharp>=0.23"]
claude = ["claude-agent-sdk>=0.1.0"]

[project.scripts]
megabrain = "megabrain.transports.cli.main:main"

[project.urls]
Homepage = "https://github.com/bernatch22/megabrain"
Repository = "https://github.com/bernatch22/megabrain"
Changelog = "https://github.com/bernatch22/megabrain/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["megabrain*"]

[tool.setuptools.package-data]
# The studio's built bundle ships INSIDE the package, so an install serves the
# UI without a node toolchain. A path outside would work from a checkout and
# 404 from a wheel — the worst possible split.
megabrain = ["py.typed", "transports/http/ui/*", "transports/http/ui/icons/*"]

[tool.setuptools.dynamic]
version = { attr = "megabrain._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
xfail_strict = true            # an xfail that passes is a FAILURE
filterwarnings = ["error"]     # a new deprecation fails the suite that day

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ARG", "TID251", "FA102", "T201"]
ignore = [
  "E501",    # prompts, tables and URLs legitimately run long
  "B905",    # zip(strict=) would change behaviour on the tuned retrieval path
  # ARG002 flags a METHOD that ignores a parameter it declares. This engine is
  # Protocol-heavy by design (Strategy, Transport, Embeddable, ParseFn), and an
  # implementation must accept the full signature whether or not it uses every
  # part of it — a fake transport that ignores `timeout` is correct, not sloppy.
  # ARG001 stays on: a plain function with an unused parameter IS a mistake.
  "ARG002",
]

[tool.ruff.lint.isort]
# Declared, because otherwise the classification DEPENDS ON THE INSTALL: from a
# checkout `megabrain` resolves as first-party, from CI's `pip install -e .` it
# looked third-party, and the same file was sorted two different ways — green
# here, `I001` on the runner.
known-first-party = ["megabrain"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "Use megabrain._utils.cache — the stdlib one drops type information"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "T201"]
# the gate is a CLI: printing its report IS its output
"evals/harness/gate.py" = ["T201"]
"scripts/*" = ["T201"]
# Same reason as scripts: the benchmark's output IS a markdown table on stdout.
"benchmarks/*" = ["T201"]
# T201 exists to keep the LIBRARY silent — a function that writes to stdout
# cannot be called from a server. The CLI is the one place where writing to a
# terminal IS the product, so the ban is lifted exactly here and nowhere deeper.
"src/megabrain/transports/cli/*" = ["T201"]

[tool.mypy]
# 3.12, NOT the 3.10 floor: numpy's shipped stubs use `type` statements that
# mypy cannot parse under an older target, and it aborts the whole run. The
# floor is still enforced, by the two gates that can do it without third-party
# stubs in the way — pyright runs at pythonVersion 3.10, and CI actually
# EXECUTES the suite on 3.10. mypy's job here is type correctness, not
# version-syntax policing.
python_version = "3.12"
strict_equality = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false     # off: would fight pyright's ignores
warn_redundant_casts = false    # idem
files = ["src/megabrain"]

[[tool.mypy.overrides]]
# The Claude Agent SDK is an OPTIONAL extra: `pip install 'megabrain[claude]'`.
# A gate that demanded it installed would make the type check depend on a
# backend most installs never use — and the provider is written so that the
# package being absent is a normal, handled state (a named ProviderError, not
# an ImportError reaching the caller). The surface it exposes is pinned by our
# own Protocol in `_claude_sdk.py`, so the shape is still checked; what is
# unchecked is only whether the real module matches it, which no stub of ours
# could honestly promise either.
module = ["claude_agent_sdk"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"          # the OLDEST supported, not the newest
include = ["src/megabrain"]
stubPath = "typings"          # our own stubs for the grammar wheels (no py.typed)
reportImportCycles = false      # lazy imports make this noisy
reportPrivateUsage = false
# reportImplicitOverride would be ON (it catches real hierarchy bugs), but
# `@override` needs typing_extensions on Python 3.10/3.11 and this package
# ships exactly three runtime dependencies on purpose. A `sys.version_info`
# shim does not help: pyright resolves it against `pythonVersion = 3.10` and
# takes the no-op branch. The mitigation is architectural — this engine is
# composition-first (Protocols + registries, shallow hierarchies), so the
# rule's value here is low. Revisit if typing_extensions ever lands as a dep.
reportImplicitOverride = false
